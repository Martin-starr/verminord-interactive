<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verminord Storskjerm</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0a0e14;--card:#141a24;--border:#1e2a3a;
  --text:#e0e6ed;--muted:#6b7d93;--accent:#4fc3f7;
  --green:#66bb6a;--gold:#ffa726;--red:#ef5350;
  --teal:#26a69a;
}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;overflow:hidden;height:100vh}
.container{display:flex;flex-direction:column;height:100vh;padding:20px 28px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-shrink:0}
.logo{font-size:28px;font-weight:700;letter-spacing:2px;color:var(--accent)}
.logo span{color:var(--muted);font-weight:400;font-size:16px;margin-left:12px}
.clock{font-size:22px;color:var(--muted);font-variant-numeric:tabular-nums}
.kpi-bar{display:flex;gap:12px;margin-bottom:16px;flex-shrink:0}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px 18px;flex:1;text-align:center}
.kpi .value{font-size:28px;font-weight:700}
.kpi .label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-top:2px}
.kpi.green .value{color:var(--green)}
.kpi.gold .value{color:var(--gold)}
.kpi.red .value{color:var(--red)}
.kpi.teal .value{color:var(--teal)}
.kpi.accent .value{color:var(--accent)}
.grid{display:grid;gap:12px;flex:1;min-height:0}
.grid.g9{grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr)}
.grid.g8{grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(2,1fr)}
.grid.g6{grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr)}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 18px;display:flex;flex-direction:column;overflow:hidden;position:relative}
.card.ok{border-left:4px solid var(--green)}
.card.watch{border-left:4px solid var(--gold)}
.card.under{border-left:4px solid var(--red)}
.card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.card-name{font-size:17px;font-weight:700}
.card-status{font-size:11px;font-weight:600;padding:3px 10px;border-radius:12px;text-transform:uppercase;letter-spacing:.5px}
.card.ok .card-status{background:rgba(102,187,106,.15);color:var(--green)}
.card.watch .card-status{background:rgba(255,167,38,.15);color:var(--gold)}
.card.under .card-status{background:rgba(239,83,80,.15);color:var(--red)}
.card-updated{font-size:11px;color:var(--muted)}
.metrics{display:flex;gap:16px;margin:8px 0}
.metric{flex:1}
.metric .val{font-size:22px;font-weight:700}
.metric .unit{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.metric.in-range .val{color:var(--green)}
.metric.out-range .val{color:var(--gold)}
.chart-area{flex:1;min-height:0;position:relative}
canvas{width:100%!important;height:100%!important}
.hygiene{background:rgba(38,166,154,.08);border:1px solid rgba(38,166,154,.2);border-radius:8px;padding:6px 10px;margin-top:4px;font-size:12px;display:flex;justify-content:space-between;align-items:center}
.hygiene .streak-val{font-weight:700;color:var(--teal)}
.hygiene.fail{background:rgba(239,83,80,.08);border-color:rgba(239,83,80,.2)}
.hygiene.fail .streak-val{color:var(--red)}
.range-tabs{display:flex;gap:6px;margin-bottom:12px;flex-shrink:0}
.range-tab{background:var(--card);border:1px solid var(--border);border-radius:6px;padding:6px 14px;font-size:12px;color:var(--muted);cursor:pointer;font-weight:600}
.range-tab.active{background:var(--accent);color:var(--bg);border-color:var(--accent)}
footer{display:flex;justify-content:space-between;align-items:center;margin-top:12px;flex-shrink:0}
.regulatory{display:flex;gap:12px;flex-wrap:wrap}
.reg-item{font-size:12px;padding:4px 12px;border-radius:6px}
.reg-item.green{background:rgba(102,187,106,.12);color:var(--green)}
.reg-item.bad{background:rgba(239,83,80,.12);color:var(--red)}
.sync-info{font-size:11px;color:var(--muted)}
.no-data{color:var(--muted);font-size:14px;text-align:center;padding-top:20px}
</style>
</head>
<body>

<div class="container" id="app">
  <div class="no-data" style="margin:auto">Laster data...</div>
</div>

<script src="mock-data.js"></script>
<script>
(function(){

var VN = window.VN || null;
var activeRange = '7D';

function $(sel, el){ return (el||document).querySelector(sel) }
function $$(sel, el){ return Array.from((el||document).querySelectorAll(sel)) }

function loadData(){
  fetch('data.json?t='+Date.now())
    .then(function(r){ if(!r.ok) throw r; return r.json() })
    .then(function(d){
      if(d && d.SYSTEMS && d.SYSTEMS.length){
        VN = d;
        window.VN = d;
        render();
      }
    })
    .catch(function(){
      if(VN) render();
    });
}

function inRange(val, targets){
  if(val===null||val===undefined||!targets) return true;
  return val >= targets[0] && val <= targets[1];
}

function fmt(v, unit){
  if(v===null||v===undefined) return '<span style="color:var(--muted)">—</span>';
  return v + (unit||'');
}

function statusLabel(s){
  if(s==='ok') return 'OK';
  if(s==='watch') return 'Avvik';
  if(s==='under') return 'Under';
  return s;
}

function sparkline(canvas, data, color){
  if(!canvas||!data||!data.length) return;
  var ctx = canvas.getContext('2d');
  var w = canvas.width = canvas.offsetWidth * 2;
  var h = canvas.height = canvas.offsetHeight * 2;
  ctx.clearRect(0,0,w,h);

  var min = Math.min.apply(null,data);
  var max = Math.max.apply(null,data);
  var range = max-min || 1;
  var pad = 4;

  ctx.beginPath();
  ctx.strokeStyle = color || 'rgba(79,195,247,.7)';
  ctx.lineWidth = 2;
  ctx.lineJoin = 'round';

  for(var i=0;i<data.length;i++){
    var x = pad + (i/(data.length-1||1)) * (w-pad*2);
    var y = h-pad - ((data[i]-min)/range) * (h-pad*2);
    if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  }
  ctx.stroke();

  ctx.lineTo(w-pad, h-pad);
  ctx.lineTo(pad, h-pad);
  ctx.closePath();
  ctx.fillStyle = (color||'rgba(79,195,247,')').replace(/[\d.]+\)$/,'.08)');
  ctx.fill();
}

function render(){
  if(!VN) return;
  var c = $('#app');
  var S = VN.SYSTEMS;
  var K = VN.KPIS || {};
  var total = S.length;
  var okCount = S.filter(function(s){return s.status==='ok'}).length;
  var health = total ? Math.round(100*okCount/total) : 0;
  var healthClass = health>=80?'green':health>=50?'gold':'red';
  var hyg = K.hygienisering||{met:0,total:0};

  var gridClass = total<=6?'g6':total<=8?'g8':'g9';

  var html = '';
  // Header
  html += '<header><div class="logo">VERMINORD<span>Storskjerm</span></div><div class="clock" id="clock"></div></header>';

  // KPI bar
  html += '<div class="kpi-bar">';
  html += '<div class="kpi '+healthClass+'"><div class="value">'+health+'%</div><div class="label">Anleggshelse ('+okCount+'/'+total+')</div></div>';
  html += '<div class="kpi '+(K.avvik?'red':'green')+'"><div class="value">'+K.avvik+'</div><div class="label">Avvik</div></div>';
  html += '<div class="kpi teal"><div class="value">'+hyg.met+'/'+hyg.total+'</div><div class="label">Hygienisering</div></div>';
  html += '<div class="kpi accent"><div class="value">'+K.aktive+'</div><div class="label">Aktive systemer</div></div>';
  html += '</div>';

  // Range tabs
  html += '<div class="range-tabs">';
  (VN.RANGES||[]).forEach(function(r){
    html += '<div class="range-tab'+(r.key===activeRange?' active':'')+'" data-range="'+r.key+'">'+r.label+'</div>';
  });
  html += '</div>';

  // System cards
  html += '<div class="grid '+gridClass+'">';
  S.forEach(function(s){
    var st = s.status||'watch';
    var tgt = s.targets||{};
    var tempOk = inRange(s.temp, tgt.temp);
    var fuktOk = inRange(s.fukt, tgt.fukt);
    var phOk = inRange(s.ph, tgt.ph);

    html += '<div class="card '+st+'">';
    html += '<div class="card-head"><span class="card-name">'+s.name+'</span><span class="card-status">'+statusLabel(st)+'</span></div>';
    html += '<div class="card-updated">Oppdatert: '+(s.updated||'—')+'</div>';
    html += '<div class="metrics">';
    html += '<div class="metric '+(tempOk?'in-range':'out-range')+'"><div class="val">'+fmt(s.temp,'°')+'</div><div class="unit">Temp</div></div>';
    html += '<div class="metric '+(phOk?'in-range':'out-range')+'"><div class="val">'+fmt(s.ph)+'</div><div class="unit">pH</div></div>';
    html += '<div class="metric '+(fuktOk?'in-range':'out-range')+'"><div class="val">'+fmt(s.fukt,'%')+'</div><div class="unit">Fukt</div></div>';
    html += '</div>';

    if(s.group==='precompost' && s.streak!==undefined){
      var ok = s.streak >= (s.required||5);
      html += '<div class="hygiene '+(ok?'':'fail')+'"><span>19 Streak</span><span class="streak-val">'+s.streak+'/'+(s.required||5)+' dgr</span></div>';
    }

    html += '<div class="chart-area"><canvas data-sys="'+s.id+'"></canvas></div>';
    html += '</div>';
  });
  html += '</div>';

  // Footer
  html += '<footer>';
  html += '<div class="regulatory">';
  (VN.REGULATORY||[]).forEach(function(r){
    html += '<div class="reg-item '+(r.tone||'')+'">'+r.label+': '+r.state+'</div>';
  });
  html += '</div>';
  html += '<div class="sync-info">Auto-refresh 5 min</div>';
  html += '</footer>';

  c.innerHTML = html;

  // Draw sparklines
  S.forEach(function(s){
    var canvas = $('canvas[data-sys="'+s.id+'"]');
    var series = (s.tempSeries||{})[activeRange]||[];
    if(series.length) sparkline(canvas, series, 'rgba(79,195,247,.7)');
  });

  // Range tab clicks
  $$('.range-tab').forEach(function(tab){
    tab.addEventListener('click', function(){
      activeRange = this.getAttribute('data-range');
      render();
    });
  });
}

function updateClock(){
  var now = new Date();
  var h = ('0'+now.getHours()).slice(-2);
  var m = ('0'+now.getMinutes()).slice(-2);
  var s = ('0'+now.getSeconds()).slice(-2);
  var el = document.getElementById('clock');
  if(el) el.textContent = h+':'+m+':'+s+'  uke '+getWeek(now);
}
function getWeek(d){
  var t = new Date(d.getFullYear(),0,1);
  return Math.ceil(((d-t)/86400000+t.getDay()+1)/7);
}

loadData();
setInterval(loadData, 5*60*1000);
setInterval(updateClock, 1000);
setTimeout(updateClock, 50);

})();
</script>
</body>
</html>
