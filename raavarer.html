<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Verminord — Råvarer</title>
<meta name="description" content="De fem ingrediensene i hver pose VermiCast." />
<meta property="og:title" content="Verminord — Råvarer" />
<meta property="og:description" content="De fem ingrediensene i hver pose VermiCast." />
<meta property="og:type" content="website" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;1,9..144,400&family=Schibsted+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; }
  html, body, #root { margin: 0; padding: 0; }
  body {
    background: #F1EADC;
    color: #1A1816;
    font-family: 'Schibsted Grotesk', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }
  #loader {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: #F1EADC; color: #1A1816;
    font-family: 'Schibsted Grotesk', system-ui, sans-serif;
    z-index: 9999;
    transition: opacity 0.4s ease;
  }
  #loader.hidden { opacity: 0; pointer-events: none; }
  .loader-text {
    font-size: 11px;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: #A07A52;
    font-weight: 600;
  }
  /* number inputs */
  input[type=number]::-webkit-inner-spin-button,
  input[type=number]::-webkit-outer-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }
  input[type=number] { -moz-appearance: textfield; }
</style>
</head>
<body>
<div id="loader"><div class="loader-text">Laster Verminord…</div></div>
<div id="root"></div>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useMemo } = React;

const palette = {
  bg: '#F1EADC',
  paper: '#FAF5EA',
  ink: '#1A1816',
  petrol: '#1E4D6B',
  petrolDark: '#143548',
  warm: '#A07A52',
  moss: '#5C6B3F',
  muted: '#9B948A',
  line: '#C9BFAE',
  rust: '#B86B3E',
  green: '#4A6B3F',
};

const materials = [
  {
    id: 'llama',
    name: 'Llama-møkk',
    sub: 'Hovedkilde til nitrogen',
    color: '#7A5A3C',
    swatch: '#5A3F26',
    pct: 30,
    origin: 'Lokal gård på Jæren',
    bidrag: ['Nitrogen', 'Mikrobiologi', 'Mild C:N'],
    detail:
      'Llama-møkk er en av de mest balanserte gjødseltypene som finnes. Den er nesten luktfri, lav på salt og har et naturlig høyt nitrogen-innhold som er biologisk tilgjengelig uten å brenne røtter. Møkka kommer fra en lokal gård i Rogaland — vi henter, de leverer kvalitet.',
    rolle: 'Nitrogen + mikrobiell oppstart',
  },
  {
    id: 'sopp',
    name: 'Brukt soppsubstrat',
    sub: 'Mycel og biologisk forbehandlet karbon',
    color: '#8E8164',
    swatch: '#5B5340',
    pct: 25,
    origin: 'Lokale soppdyrkere',
    bidrag: ['Mycel', 'Halv-nedbrudt C', 'Soppdominans'],
    detail:
      'Brukt soppsubstrat er allerede halvveis fordøyd av sopp-mycel — perfekt utgangspunkt for vermikompost. Det gir et soppdominert kompostprofil som støtter mykorrhiza-nettverk i jorda hos kunden. Vi henter overskuddsmateriale fra lokale soppdyrkere, og lukker en sirkulær strøm som ellers blir avfall.',
    rolle: 'Soppdominans + biologisk forsprang',
  },
  {
    id: 'lov',
    name: 'Løvmold',
    sub: 'Høstløv — langsom karbon og naturlig biologi',
    color: '#8B6B3F',
    swatch: '#5A4022',
    pct: 20,
    origin: 'Skoler, kommuner, lokale samlere',
    bidrag: ['Langsom C', 'Skogbiologi', 'Struktur'],
    detail:
      'Rene høstløv tilfører langsomt nedbrytbart karbon og et helt økosystem av skogbiologi — bakterier, sopp og småorganismer som har levd sammen i naturlig løvskog. Vi samler inn løv lokalt fra skoler, kommuner og lokale partnere som ellers ville sendt det til forbrenning.',
    rolle: 'Skogbiologi + langsom karbon',
  },
  {
    id: 'papp',
    name: 'Papp',
    sub: 'Strukturkarbon og luftporer',
    color: '#A6885E',
    swatch: '#6F583A',
    pct: 15,
    origin: 'Lokale bedrifter (ren, ublekt)',
    bidrag: ['Karbon', 'Struktur', 'Fuktbalanse'],
    detail:
      'Ren, ublekt papp gir strukturkarbon som holder luftporer åpne i batchen. Den bryter ned i takt med biologien og forhindrer kompaktering — uten luft, ingen sunn forkompost. Vi bruker kun papp uten plast, tape eller fargetrykk.',
    rolle: 'Struktur og lufttilgang',
  },
  {
    id: 'flis',
    name: 'Sagflis',
    sub: 'Tørt karbon og drenering',
    color: '#C9AB7F',
    swatch: '#856538',
    pct: 10,
    origin: 'Lokale snekkerverksteder',
    bidrag: ['Høy C', 'Drenering', 'Tørrjustering'],
    detail:
      'Tørr sagflis fra lokale snekkerverksteder fungerer som karbon-buffer og fuktregulator. Når batchen blir for våt, balanserer sagflis ut blandingen. Det gir også en porøs struktur som holder marken sunn og aktiv.',
    rolle: 'Fuktregulator og finstruktur',
  },
];

function VerminordRaavarer() {
  const [active, setActive] = useState(null);
  const [hovered, setHovered] = useState(null);

  

  const activeMat = materials.find((m) => m.id === active);

  return (
    <div
      style={{
        fontFamily: '"Schibsted Grotesk", system-ui, sans-serif',
        background: palette.bg,
        color: palette.ink,
        minHeight: '100vh',
        padding: '48px 28px 56px',
        boxSizing: 'border-box',
      }}
    >
      <div style={{ maxWidth: 1180, margin: '0 auto' }}>
        <header style={{ marginBottom: 32 }}>
          <div
            style={{
              fontSize: 10.5,
              letterSpacing: '0.22em',
              textTransform: 'uppercase',
              color: palette.warm,
              fontWeight: 600,
            }}
          >
            Verminord — Råvarer
          </div>
          <h1
            style={{
              fontFamily: '"Fraunces", serif',
              fontSize: 'clamp(34px, 5.6vw, 64px)',
              lineHeight: 1.02,
              margin: '14px 0 0 0',
              fontWeight: 400,
              letterSpacing: '-0.02em',
              maxWidth: 940,
              fontVariationSettings: '"opsz" 144',
            }}
          >
            Fem ingredienser{' '}
            <em
              style={{
                fontStyle: 'italic',
                color: palette.petrol,
                fontWeight: 500,
              }}
            >
              fra lokale kilder
            </em>
          </h1>
          <p
            style={{
              fontSize: 15.5,
              lineHeight: 1.6,
              maxWidth: 680,
              margin: '22px 0 0 0',
              color: '#3A3631',
            }}
          >
            Hver pose VermiCast begynner med fem råvarer. Alle er lokale, alle er rene, og alle har en spesifikk
            biologisk rolle i sluttproduktet. Trykk på en for å se hva den bidrar med og hvor den kommer fra.
          </p>
        </header>

        {/* Proportion bar */}
        <div style={{ marginBottom: 28 }}>
          <div
            style={{
              fontSize: 10,
              letterSpacing: '0.22em',
              textTransform: 'uppercase',
              color: palette.muted,
              fontWeight: 600,
              marginBottom: 10,
            }}
          >
            Resepten · tilnærmet andel i forkompost
          </div>
          <div
            style={{
              display: 'flex',
              height: 38,
              border: `1px solid ${palette.ink}`,
              overflow: 'hidden',
            }}
          >
            {materials.map((m) => {
              const isActive = active === m.id;
              const isHover = hovered === m.id;
              return (
                <div
                  key={m.id}
                  onClick={() => setActive(isActive ? null : m.id)}
                  onMouseEnter={() => setHovered(m.id)}
                  onMouseLeave={() => setHovered(null)}
                  style={{
                    flex: m.pct,
                    background: m.color,
                    cursor: 'pointer',
                    position: 'relative',
                    borderRight: `1px solid ${palette.ink}`,
                    opacity: active && !isActive ? 0.5 : 1,
                    transition: 'opacity 0.25s',
                  }}
                >
                  <div
                    style={{
                      position: 'absolute',
                      top: '50%',
                      left: '50%',
                      transform: 'translate(-50%, -50%)',
                      color: palette.bg,
                      fontSize: 11,
                      fontWeight: 700,
                      letterSpacing: '0.08em',
                      whiteSpace: 'nowrap',
                      pointerEvents: 'none',
                    }}
                  >
                    {m.pct}%
                  </div>
                  {(isActive || isHover) && (
                    <div
                      style={{
                        position: 'absolute',
                        bottom: -22,
                        left: '50%',
                        transform: 'translateX(-50%)',
                        fontSize: 10.5,
                        color: m.color,
                        fontWeight: 600,
                        whiteSpace: 'nowrap',
                      }}
                    >
                      {m.name}
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        </div>

        {/* Cards grid */}
        <div
          style={{
            display: 'grid',
            gridTemplateColumns: 'repeat(auto-fit, minmax(220px, 1fr))',
            gap: 14,
            marginTop: 36,
          }}
        >
          {materials.map((m, i) => {
            const isActive = active === m.id;
            const isHover = hovered === m.id;
            return (
              <div
                key={m.id}
                onClick={() => setActive(isActive ? null : m.id)}
                onMouseEnter={() => setHovered(m.id)}
                onMouseLeave={() => setHovered(null)}
                style={{
                  background: palette.paper,
                  border: `1px solid ${isActive ? m.color : palette.line}`,
                  borderTop: `4px solid ${m.color}`,
                  padding: '18px 18px',
                  cursor: 'pointer',
                  transition: 'all 0.25s ease',
                  transform: isActive || isHover ? 'translateY(-3px)' : 'none',
                  opacity: 0,
                  animation: `fadeUp 0.6s ${0.1 + i * 0.08}s ease-out forwards`,
                }}
              >
                <div
                  style={{
                    display: 'flex',
                    alignItems: 'center',
                    gap: 12,
                    marginBottom: 12,
                  }}
                >
                  {/* swatch */}
                  <div
                    style={{
                      width: 32,
                      height: 32,
                      background: m.swatch,
                      border: `1px solid ${palette.ink}`,
                      flexShrink: 0,
                    }}
                  />
                  <div
                    style={{
                      fontFamily: '"JetBrains Mono", monospace',
                      fontSize: 12,
                      fontWeight: 600,
                      color: m.color,
                    }}
                  >
                    {m.pct}%
                  </div>
                </div>

                <div
                  style={{
                    fontFamily: '"Fraunces", serif',
                    fontSize: 19,
                    fontWeight: 500,
                    lineHeight: 1.2,
                    letterSpacing: '-0.01em',
                  }}
                >
                  {m.name}
                </div>
                <div
                  style={{
                    fontSize: 12,
                    fontStyle: 'italic',
                    fontFamily: '"Fraunces", serif',
                    color: palette.muted,
                    marginTop: 4,
                  }}
                >
                  {m.sub}
                </div>

                <div
                  style={{
                    marginTop: 14,
                    display: 'flex',
                    gap: 4,
                    flexWrap: 'wrap',
                  }}
                >
                  {m.bidrag.map((b, j) => (
                    <span
                      key={j}
                      style={{
                        fontSize: 9.5,
                        letterSpacing: '0.08em',
                        textTransform: 'uppercase',
                        fontWeight: 600,
                        padding: '3px 7px',
                        border: `1px solid ${m.color}`,
                        color: m.color,
                      }}
                    >
                      {b}
                    </span>
                  ))}
                </div>
              </div>
            );
          })}
        </div>

        <div
          style={{
            marginTop: 24,
            background: activeMat ? palette.paper : 'transparent',
            border: activeMat ? `1px solid ${palette.line}` : '1px dashed transparent',
            padding: '28px 30px',
            minHeight: 180,
            transition: 'all 0.3s ease',
          }}
        >
          {activeMat ? (
            <div>
              <div
                style={{
                  display: 'flex',
                  alignItems: 'center',
                  gap: 14,
                  marginBottom: 12,
                  flexWrap: 'wrap',
                }}
              >
                <div
                  style={{
                    width: 28,
                    height: 28,
                    background: activeMat.swatch,
                    border: `1px solid ${palette.ink}`,
                  }}
                />
                <span
                  style={{
                    fontSize: 10,
                    letterSpacing: '0.24em',
                    textTransform: 'uppercase',
                    color: activeMat.color,
                    fontWeight: 700,
                  }}
                >
                  {activeMat.rolle}
                </span>
              </div>
              <h3
                style={{
                  fontFamily: '"Fraunces", serif',
                  fontSize: 28,
                  lineHeight: 1.18,
                  margin: 0,
                  fontWeight: 500,
                  letterSpacing: '-0.01em',
                }}
              >
                {activeMat.name} —{' '}
                <em
                  style={{
                    fontStyle: 'italic',
                    color: activeMat.color,
                  }}
                >
                  {activeMat.sub}
                </em>
              </h3>
              <div
                style={{
                  display: 'grid',
                  gridTemplateColumns: 'repeat(auto-fit, minmax(260px, 1fr))',
                  gap: 32,
                  marginTop: 22,
                }}
              >
                <div>
                  <div
                    style={{
                      fontSize: 10,
                      letterSpacing: '0.2em',
                      textTransform: 'uppercase',
                      color: palette.warm,
                      fontWeight: 600,
                      marginBottom: 8,
                    }}
                  >
                    Hva det bidrar med
                  </div>
                  <p style={{ fontSize: 14.5, lineHeight: 1.62, margin: 0, color: '#3A3631' }}>{activeMat.detail}</p>
                </div>
                <div>
                  <div
                    style={{
                      fontSize: 10,
                      letterSpacing: '0.2em',
                      textTransform: 'uppercase',
                      color: palette.moss,
                      fontWeight: 600,
                      marginBottom: 8,
                    }}
                  >
                    Lokal kilde
                  </div>
                  <p
                    style={{
                      fontSize: 14.5,
                      lineHeight: 1.62,
                      margin: 0,
                      color: '#3A3631',
                      fontFamily: '"Fraunces", serif',
                      fontStyle: 'italic',
                    }}
                  >
                    {activeMat.origin}
                  </p>
                </div>
              </div>
            </div>
          ) : (
            <div
              style={{
                color: palette.muted,
                fontSize: 13.5,
                textAlign: 'center',
                fontStyle: 'italic',
                fontFamily: '"Fraunces", serif',
                paddingTop: 40,
              }}
            >
              Trykk på et råstoff for å se hva det bidrar med.
            </div>
          )}
        </div>

        <footer
          style={{
            marginTop: 56,
            paddingTop: 22,
            borderTop: `1px solid ${palette.line}`,
            display: 'flex',
            justifyContent: 'space-between',
            flexWrap: 'wrap',
            fontSize: 12,
            color: palette.muted,
            gap: 16,
            letterSpacing: '0.02em',
          }}
        >
          <span>Verminord AS · Råvarer fra Jæren</span>
          <span
            style={{
              fontStyle: 'italic',
              fontFamily: '"Fraunces", serif',
              color: '#5A5650',
            }}
          >
            laget av dyrkere, for dyrkere
          </span>
        </footer>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<VerminordRaavarer />);

setTimeout(() => {
  const loader = document.getElementById('loader');
  if (loader) {
    loader.classList.add('hidden');
    setTimeout(() => loader.remove(), 500);
  }
}, 200);
</script>
</body>
</html>
